name: ci

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'docs/**'
      - 'test/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    permissions:
      contents: none
    outputs:
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - id: check
        name: Check branch name convention
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          echo "Branch: $BRANCH"
          if echo "$BRANCH" | grep -qE '^(feature|fix|hotfix|chore|refactor|docs|test)/[0-9]+-[a-z0-9-]+$|^main$'; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Branch name is valid"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::error::Branch name '$BRANCH' does not follow the convention: <type>/<number>-<description>"
            echo "::error::Allowed types: feature, fix, hotfix, chore, refactor, docs, test"
            exit 1
          fi

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: branch-name
    permissions:
      contents: read
    # The engine tests are Redis integration tests: they assert the atomicity of
    # pair.lua (SET NX / EVALSHA), the ZSET ordering and the match-pending TTL.
    # They read REDIS_URI (default redis://localhost:6379), so the job needs a
    # real Redis — a mock would delete the property under test.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: List build artifacts
        if: always()
        run: |
          echo "Build artifacts:"
          find . -path '*/target/*.jar' -type f 2>/dev/null | head -20 || echo "(none)"

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts-${{ github.sha }}
          path: |
            */target/*.jar
          retention-days: 30

  contracts:
    name: Event contract gate
    runs-on: ubuntu-latest
    needs: branch-name
    permissions:
      contents: read
    # The gate needs a real Schema Registry: the compatibility verdict is the
    # registry's, so a mock would delete the property under test. The stack comes
    # from the same docker-compose.yml used in development — a hand-written
    # services block would duplicate the Kafka topology (listeners, FULL) and the
    # two would drift. The fixed project name keeps the container names the
    # scripts already know.
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate compares the change against its merge base, so the base ref
          # has to be present locally.
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start Kafka, Zookeeper and Schema Registry
        run: docker compose -p game-matchmaking-backend up -d zookeeper kafka schema-registry

      - name: Wait for the stack to be healthy
        run: |
          for service in zookeeper kafka schema-registry; do
            status=missing
            for _ in $(seq 1 60); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                "game-matchmaking-backend-$service-1" 2>/dev/null || echo missing)"
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            echo "$service: $status"
            [ "$status" = "healthy" ] || exit 1
          done

      - name: Kafka + Schema Registry smoke check
        run: bash requests/kafka/check_kafka.sh

      - name: Event contracts (this change against its merge base)
        run: bash requests/kafka/check_contract_gate.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose -p game-matchmaking-backend logs --tail 50
