# Prometheus (W15, ADR 0020), same jobs as prometheus.yml but for a Prometheus running
# directly on the host instead of in the container.
#
# Why it exists: `prometheus.yml` targets `host.docker.internal`, which only resolves from
# inside a container (Docker Desktop provides it; on Linux the compose file maps it through
# extra_hosts). When the Prometheus binary is run on the host - the fallback when container
# images cannot be pulled - the services are reachable as localhost, and this is the file to
# point at:
#
#   prometheus --config.file=ops/prometheus/prometheus.host.yml --web.listen-address=:9095 \
#              --storage.tsdb.path=/tmp/prometheus-w15
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: matchmaking-api
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: matchmaking-api

  - job_name: matchmaking-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9091"]
        labels:
          service: matchmaking-engine
