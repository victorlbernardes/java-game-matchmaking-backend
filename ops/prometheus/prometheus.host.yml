# Prometheus (W15, ADR 0020; SLO rules W16, ADR 0021), same jobs as prometheus.yml but for a
# Prometheus running directly on the host instead of in the container.
#
# Why it exists: `prometheus.yml` targets `host.docker.internal`, which only resolves from
# inside a container (Docker Desktop provides it; on Linux the compose file maps it through
# extra_hosts). When the Prometheus binary is run on the host - the fallback when container
# images cannot be pulled - the services are reachable as localhost, and this is the file to
# point at:
#
#   prometheus --config.file=ops/prometheus/prometheus.host.yml --web.listen-address=:9095 \
#              --storage.tsdb.path=/tmp/prometheus-w15
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# The SLO rules (W16, ADR 0021). Prometheus resolves a relative rule_files entry against the
# directory of the config file - not the working directory - so from the repository the path
# is the sibling `rules` directory. Measured the hard way: `ops/prometheus/rules/*.yml` here
# resolved to `ops/prometheus/ops/prometheus/rules/*.yml`, loaded zero groups and looked
# healthy (no rule file to refuse), which is why the scenario asserts the groups exist.
rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: matchmaking-api
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: matchmaking-api

  - job_name: matchmaking-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9091"]
        labels:
          service: matchmaking-engine
